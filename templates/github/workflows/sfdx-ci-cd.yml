# Generated by sfdx-devops-kit. The pipeline's shape lives in
# sfdx-pipeline.config.yml — edit that file, not this one. Every step below is
# gated by the plan this kit derives from it, so disabling a stage in the config
# disables it here.
name: SFDX CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment key from sfdx-pipeline.config.yml"
        required: false
        default: "st"
      deploy:
        description: "Run the real deployment (not just validation)"
        type: boolean
        required: false
        default: false

# One run per branch; a newer push cancels an in-flight run.
concurrency:
  group: sfdx-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  SF_DISABLE_TELEMETRY: "true"
  SF_DISABLE_AUTOUPDATE: "true"

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the pipeline from the config file. Later jobs read `enabled.<stage>`
  # from this output instead of hard-coding what runs.
  # ---------------------------------------------------------------------------
  plan:
    name: Resolve pipeline plan
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      environment: ${{ steps.plan.outputs.environment }}
      auth_secret: ${{ steps.plan.outputs.auth_secret }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Validate configuration
        run: npx sfdx-devops-kit validate

      - name: Resolve plan
        id: plan
        env:
          ENV_KEY: ${{ github.event.inputs.environment || 'st' }}
        run: |
          npx sfdx-devops-kit plan --env "$ENV_KEY" --json > pipeline-plan.json
          {
            echo "plan=$(jq -c . pipeline-plan.json)"
            echo "environment=$(jq -r '.environment.alias' pipeline-plan.json)"
            echo "auth_secret=$(jq -r '.environment.auth_secret' pipeline-plan.json)"
          } >> "$GITHUB_OUTPUT"
          npx sfdx-devops-kit plan --env "$ENV_KEY" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: pipeline-plan
          path: pipeline-plan.json

  # ---------------------------------------------------------------------------
  # Static quality: ESLint, Prettier, Salesforce Code Analyzer.
  # ---------------------------------------------------------------------------
  quality:
    name: Static quality
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint (ESLint)
        if: fromJSON(needs.plan.outputs.plan).enabled.lint
        run: npx sfdx-devops-kit run lint

      - name: Format check (Prettier)
        if: fromJSON(needs.plan.outputs.plan).enabled.prettier
        run: npx sfdx-devops-kit run prettier

      # The PMD, CPD and SFGE engines are Java-based. Without a JDK they fail to
      # start and Code Analyzer reports that as severity-1 findings.
      - name: Set up Java (Code Analyzer engines)
        if: fromJSON(needs.plan.outputs.plan).enabled.code_analyzer
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25" # current LTS; Code Analyzer needs JDK 11 or later

      - name: Install Salesforce CLI
        if: fromJSON(needs.plan.outputs.plan).enabled.code_analyzer
        run: npm install --global @salesforce/cli@latest

      - name: Salesforce Code Analyzer
        if: fromJSON(needs.plan.outputs.plan).enabled.code_analyzer
        run: npx sfdx-devops-kit run code_analyzer

      - name: Upload analyzer report
        if: always() && fromJSON(needs.plan.outputs.plan).enabled.code_analyzer
        uses: actions/upload-artifact@v7
        with:
          name: code-analyzer-results
          path: code-analyzer-results.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Validation deploy against the test org, then the coverage gate. Apex tests
  # run once, inside the validation deploy; the gate reads its result.
  # ---------------------------------------------------------------------------
  validate:
    name: Validation deploy and coverage gate
    needs: [plan, quality]
    if: fromJSON(needs.plan.outputs.plan).enabled.validate_deploy || fromJSON(needs.plan.outputs.plan).enabled.unit_test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@latest

      - name: Authorize target org
        env:
          SFDX_AUTH_URL: ${{ secrets[needs.plan.outputs.auth_secret] }}
        run: |
          if [ -z "${SFDX_AUTH_URL}" ]; then
            echo "::error::Secret ${{ needs.plan.outputs.auth_secret }} is not set. Add the SFDX auth URL for ${{ needs.plan.outputs.environment }}."
            exit 1
          fi
          printf '%s' "${SFDX_AUTH_URL}" > ./sfdx-auth-url.txt
          sf org login sfdx-url --sfdx-url-file ./sfdx-auth-url.txt --alias "${{ needs.plan.outputs.environment }}" --set-default
          rm -f ./sfdx-auth-url.txt

      - name: Validation deploy and coverage gate
        run: npx sfdx-devops-kit run validate_deploy unit_test --json | tee pipeline-validate.json

      - name: Summarize
        if: always()
        run: |
          if [ -f pipeline-validate.json ]; then
            jq -r '.results[] | "- \(.id): \(.status) — \(.message)"' pipeline-validate.json >> "$GITHUB_STEP_SUMMARY" || true
          fi

  # ---------------------------------------------------------------------------
  # Real deployment plus post-deploy verification. Never runs on a pull request:
  # a fork PR must not be able to deploy into an org.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy and verify
    needs: [plan, validate]
    if: |
      github.event_name != 'pull_request' &&
      fromJSON(needs.plan.outputs.plan).enabled.deploy
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@latest

      - name: Authorize target org
        env:
          SFDX_AUTH_URL: ${{ secrets[needs.plan.outputs.auth_secret] }}
        run: |
          printf '%s' "${SFDX_AUTH_URL}" > ./sfdx-auth-url.txt
          sf org login sfdx-url --sfdx-url-file ./sfdx-auth-url.txt --alias "${{ needs.plan.outputs.environment }}" --set-default
          rm -f ./sfdx-auth-url.txt

      - name: Deploy
        run: npx sfdx-devops-kit run deploy

      - name: Integration tests
        if: fromJSON(needs.plan.outputs.plan).enabled.integration_test
        run: npx sfdx-devops-kit run integration_test

      - name: Install Playwright browsers
        if: fromJSON(needs.plan.outputs.plan).enabled.e2e_test
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        if: fromJSON(needs.plan.outputs.plan).enabled.e2e_test
        run: npx sfdx-devops-kit run e2e_test

      - name: Upload Playwright report
        if: always() && fromJSON(needs.plan.outputs.plan).enabled.e2e_test
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

      # rtk-sf generates the system document set. It is installed here rather
      # than assumed, and the stage self-skips when unavailable.
      - name: Set up Python (rtk-sf)
        if: fromJSON(needs.plan.outputs.plan).enabled.documentation
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install rtk-sf
        if: fromJSON(needs.plan.outputs.plan).enabled.documentation
        run: pip install "git+https://github.com/furuCRM-Inc/rtk-sf.git@v0.10.1"

      - name: Generate system documentation
        if: fromJSON(needs.plan.outputs.plan).enabled.documentation
        run: npx sfdx-devops-kit run documentation

      - name: Upload generated documentation
        if: fromJSON(needs.plan.outputs.plan).enabled.documentation
        uses: actions/upload-artifact@v7
        with:
          name: system-documentation
          path: docs
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Record the metadata this ticket delivered on the pull request, so the ticket
  # and the PR carry the same artifact list.
  # ---------------------------------------------------------------------------
  deliverables:
    name: Metadata deliverables
    needs: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Derive deliverables
        run: |
          npx sfdx-devops-kit deliverables \
            --base "origin/${{ github.base_ref }}" --format md --out deliverables.md
          npx sfdx-devops-kit deliverables \
            --base "origin/${{ github.base_ref }}" --format package-xml --out manifest/ticket-package.xml
          cat deliverables.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: deliverables
          path: |
            deliverables.md
            manifest/ticket-package.xml
