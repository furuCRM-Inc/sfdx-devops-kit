# sfdx-pipeline.config.yml — single source of truth for this project's pipeline.
#
# GitHub Actions, the local `sfdx-devops-kit` CLI and the Claude Code skills all
# read this file. Changing a threshold or adding a sandbox here is the whole
# change: no workflow editing required.
#
# Validate after every edit:  npx sfdx-devops-kit validate
version: "1.0"
project_name: "__PROJECT_NAME__"

# ---------------------------------------------------------------------------
# Environments
#
# `alias` is the org alias or username. Each environment's SFDX auth URL is read
# from a GitHub Secret named SF_<KEY>_AUTH_URL (e.g. SF_ST_AUTH_URL), or from
# `auth_secret` when you name it explicitly.
#
# Declare at most ONE deployment selector per environment — deploy_manifest,
# source_dir or metadata. The Salesforce CLI rejects those flags in combination.
# ---------------------------------------------------------------------------
environments:
  dev:
    alias: "DevSandbox"
    type: "sandbox"
    # deploy_manifest: "manifest/package.xml"

  st:
    alias: "STSandbox"
    type: "sandbox"
    is_test_target: true # CI validates and runs E2E against this org

  uat:
    alias: "UATSandbox"
    type: "sandbox"

  prod:
    alias: "Production"
    type: "production"

# ---------------------------------------------------------------------------
# Pipeline stages, in execution order. `enabled: false` removes a stage
# everywhere: CI skips the step and `plan` explains why.
# ---------------------------------------------------------------------------
pipeline_settings:
  lint:
    enabled: true
    fail_on_error: true
    command: "npm run lint"

  prettier:
    enabled: true
    fail_on_error: true
    command: "npm run prettier"

  code_analyzer:
    enabled: true
    engine: "code-analyzer" # code-analyzer (v5) | scanner (legacy sfdx-scanner)
    rule_selector: "Recommended" # v5 selector: engine:severity:tag combinations
    pmd_rule_set: "" # legacy engine only, e.g. category/apex/bestpractices.xml
    severity_threshold: 3 # fail on violations at this severity or worse (1=Critical … 5=Info)
    target: "force-app"
    output_file: "code-analyzer-results.json"

  validate_deploy:
    enabled: true # dry-run deployment to the test target before merging

  unit_test:
    enabled: true
    test_level: "RunLocalTests" # NoTestRun | RunSpecifiedTests | RunLocalTests | RunAllTestsInOrg
    tests: [] # required when test_level is RunSpecifiedTests
    coverage_threshold: 75

  deploy:
    enabled: true # real deployment; CI runs this only outside pull requests

  integration_test:
    enabled: false
    tool: "newman" # newman | custom
    command: "" # required when tool is custom

  e2e_test:
    enabled: true
    tool: "playwright" # playwright | custom
    command: "npx playwright test"

  # System documentation generated by rtk-sf (see ai_assist below).
  documentation:
    enabled: true
    tool: "rtk-sf"
    doc_type: "all" # all | function_matrix | sequence_diagrams | erd | …
    output_dir: "docs"

# ---------------------------------------------------------------------------
# AI assistance
#
# rtk-sf (https://github.com/furuCRM-Inc/rtk-sf) is integrated by default: it
# serves compressed metadata specs over MCP so an agent reads a class skeleton
# instead of a whole file, and it generates the document set above.
#
# `required: false` keeps this project runnable without it — stages that need
# rtk-sf are skipped with a warning rather than failing the build.
# ---------------------------------------------------------------------------
ai_assist:
  rtk_sf:
    enabled: true
    required: false
    python: "python3"
    index_on_setup: true
    register_mcp: true

# ---------------------------------------------------------------------------
# Backlog integration
#
# The kit never talks to Backlog directly: the Claude Code skills call your
# Backlog MCP server, so no API credentials live in this repository. This block
# only tells them which ticket a branch belongs to and which status names to use.
# ---------------------------------------------------------------------------
backlog_integration:
  project_key: "PROJECT_KEY"
  branch_pattern: "([A-Z][A-Z0-9_]*-\\d+)" # matches feature/PROJECT_KEY-123-something
  status_mapping:
    in_progress: "処理中"
    review_ready: "処理済み"
    closed: "完了"

  # nulab/backlog-mcp-server exposes no status-listing tool, so a status name
  # cannot be looked up at runtime. Backlog's built-in statuses have fixed ids
  # (1 未対応 / 2 処理中 / 3 処理済み / 4 完了) and are resolved automatically.
  # A project with custom statuses must list them here, otherwise the skills post
  # their comment and leave the status unchanged rather than guessing an id.
  status_ids: {}
  # Backlog renders comments as Markdown or in Backlog notation, per project
  # (Project settings → text formatting rule). A Markdown table posted into a
  # Backlog-notation project shows literal pipe characters, so pick the dialect
  # your project uses: markdown | backlog
  comment_format: "markdown"
  # status_ids:
  #   レビュー待ち: 5
  #   リリース待ち: 6

  # The MCP server registered in .mcp.json. Credentials stay in the environment
  # (BACKLOG_DOMAIN, BACKLOG_API_KEY) and never enter this repository.
  mcp:
    server_name: "backlog"
    runtime: "docker" # docker | npx
    toolsets: "space,project,issue"
    tool_prefix: "" # set when the server runs with --prefix to avoid collisions
  deliverables:
    # Post the metadata a ticket delivered as a comment when review passes.
    post_on_review: true
    include_package_xml: true
    include_non_metadata: true
    # Include the pull request URL so a reviewer reaches the code from the
    # ticket. Resolved with `gh`; before the PR exists a compare link is used.
    include_pr_link: true
