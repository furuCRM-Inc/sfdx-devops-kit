# CI for the kit itself. The pipeline it generates for consumer projects lives in
# templates/github/workflows/sfdx-ci-cd.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22", "24", "26"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

  scaffold:
    name: Scaffold into a real SFDX project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli@latest

      - name: Generate a project and install the pipeline
        run: |
          sf project generate --name demoProject --template standard --output-dir /tmp/spk
          node bin/cli.mjs init /tmp/spk/demoProject --project-name demoProject

      - name: The generated config must validate and plan
        working-directory: /tmp/spk/demoProject
        run: |
          npm install --no-audit --no-fund --silent
          node "$GITHUB_WORKSPACE/bin/cli.mjs" validate
          node "$GITHUB_WORKSPACE/bin/cli.mjs" plan --env st
          node "$GITHUB_WORKSPACE/bin/cli.mjs" run --dry-run --env st

      - name: Re-running init must not overwrite anything
        working-directory: /tmp/spk/demoProject
        run: |
          node "$GITHUB_WORKSPACE/bin/cli.mjs" init . --project-name demoProject | tee second-init.log
          if grep -q "overwritten: [1-9]" second-init.log; then
            echo "::error::init overwrote files on a second run"
            exit 1
          fi

  toolchain:
    name: Toolchain (Java 25, Python 3.14, ESLint on a real LWC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - run: npm ci

      - name: Install the Salesforce CLI and Code Analyzer
        run: |
          npm install --global @salesforce/cli@latest
          sf plugins install code-analyzer@latest
          sf --version
          java -version

      - name: Scaffold a project with a real LWC
        run: |
          sf project generate --name demoProject --template standard --output-dir /tmp/tc
          node bin/cli.mjs init /tmp/tc/demoProject --project-name demoProject
          cd /tmp/tc/demoProject
          npm install --no-audit --no-fund --silent
          sf lightning generate component --type lwc --name demoCard \
            --output-dir force-app/main/default/lwc

      # The gate must fail on real findings, and say which rules fired. A green
      # lint stage over a file with two known violations would mean the gate is
      # decorative.
      - name: ESLint gate must fail on known LWC violations
        working-directory: /tmp/tc/demoProject
        run: |
          cat > force-app/main/default/lwc/demoCard/demoCard.js <<'JS'
          import { LightningElement } from 'lwc';

          export default class DemoCard extends LightningElement {
              connectedCallback() {
                  const node = document.querySelector('.demo');
                  window.setTimeout(() => node.remove(), 1000);
              }
          }
          JS
          set +e
          node "$GITHUB_WORKSPACE/bin/cli.mjs" run lint > lint.log 2>&1
          status=$?
          set -e
          cat lint.log
          [ "$status" -eq 1 ] || { echo "::error::the lint gate did not fail (exit $status)"; exit 1; }
          grep -q "no-document-query" lint.log || { echo "::error::the findings were not reported"; exit 1; }

      - name: ESLint gate must pass on clean code
        working-directory: /tmp/tc/demoProject
        run: |
          cat > force-app/main/default/lwc/demoCard/demoCard.js <<'JS'
          import { LightningElement, api } from 'lwc';

          export default class DemoCard extends LightningElement {
              @api recordId;

              get greeting() {
                  return 'Hello';
              }
          }
          JS
          node "$GITHUB_WORKSPACE/bin/cli.mjs" run lint

      # Prettier's gate has to be a check: a `--write` command would rewrite the
      # tree and pass. Formatting first, then checking, must leave it clean.
      - name: Prettier gate is a check, not a formatter
        working-directory: /tmp/tc/demoProject
        run: |
          npm run pipeline:format --silent
          node "$GITHUB_WORKSPACE/bin/cli.mjs" run prettier

      # PMD, CPD and SFGE are Java processes. On an unsupported JVM they fail to
      # start, which this kit reports as an environment problem — so a passing
      # stage here is evidence the JDK bump is safe.
      - name: Code Analyzer engines must start on Java 25
        working-directory: /tmp/tc/demoProject
        run: node "$GITHUB_WORKSPACE/bin/cli.mjs" run code_analyzer

      - name: rtk-sf must install and index on Python 3.14
        working-directory: /tmp/tc/demoProject
        run: |
          pip install "git+https://github.com/furuCRM-Inc/rtk-sf.git@v0.10.1"
          python -m rtk_sf --version
          python -m rtk_sf index
          node "$GITHUB_WORKSPACE/bin/cli.mjs" doctor

  lint:
    name: Templates and secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Templates must parse
        run: |
          node -e "
            import('js-yaml').then(async ({ load }) => {
              const fs = await import('node:fs');
              for (const file of [
                'templates/config/sfdx-pipeline.config.yml',
                'templates/github/workflows/sfdx-ci-cd.yml',
                '.github/workflows/ci.yml',
              ]) {
                if (!load(fs.readFileSync(file, 'utf8'))) throw new Error('empty document: ' + file);
                console.log('ok', file);
              }
              JSON.parse(fs.readFileSync('templates/mcp/.mcp.json', 'utf8'));
              console.log('ok templates/mcp/.mcp.json');
            })
          "

      - name: No credentials committed
        run: |
          # An SFDX auth URL, a Backlog key or a private key must never land here.
          if grep -rInE "force://PlatformCLI::[A-Za-z0-9]{10,}|BACKLOG_API_KEY[=:][[:space:]]*[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|PRIVATE) KEY" \
               --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "::error::a credential-looking string is present in the repository"
            exit 1
          fi
          echo "no credential patterns found"
